name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  # Ruční nasazení – i návrat na starší verzi:
  # Actions → „Deploy na GitHub Pages“ → Run workflow → do pole verze napiš např. v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Verze k nasazení (tag, např. v1.0.0). Prázdné = nejnovější main.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
